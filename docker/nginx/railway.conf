server {
    listen 8080;
    server_name _;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 64M;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' cdn.jsdelivr.net fonts.googleapis.com static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' cdn.jsdelivr.net fonts.googleapis.com fonts.gstatic.com; font-src 'self' fonts.gstatic.com; img-src 'self' data: blob: *.r2.dev *.cloudflarestorage.com virtualtour-storage.xuanjinyu.codes https://ui-avatars.com; media-src 'self' blob: *.r2.dev *.cloudflarestorage.com virtualtour-storage.xuanjinyu.codes; connect-src 'self' *.r2.dev *.cloudflarestorage.com virtualtour-storage.xuanjinyu.codes; worker-src blob:; frame-ancestors 'none';" always;

    # Favicon — short cache so updates are seen without a hard refresh
    location ~* ^/favicon\.(ico|svg|png)$ {
        expires 1d;
        add_header Cache-Control "public";
        try_files $uri /index.php?$query_string;
    }

    # Static assets — fall through to Laravel for virtual paths (e.g. Livewire JS)
    location ~* \.(css|js|woff2?|ttf|otf|eot|svg|ico|png|jpg|jpeg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri /index.php?$query_string;
    }

    # Laravel entry point
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM — single container, 127.0.0.1 instead of "app" hostname
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* ^/(storage|bootstrap/cache) {
        deny all;
    }
}
