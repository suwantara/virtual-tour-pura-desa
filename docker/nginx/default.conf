server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    resolver 10.89.0.1;

    # Max upload size (for R2 pre-signed uploads this may not matter, but keep generous)
    client_max_body_size 64M;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self' localhost:5173; script-src 'self' 'unsafe-inline' 'unsafe-eval' cdn.jsdelivr.net fonts.googleapis.com localhost:5173; style-src 'self' 'unsafe-inline' cdn.jsdelivr.net fonts.googleapis.com fonts.gstatic.com localhost:5173; font-src 'self' fonts.gstatic.com localhost:5173; img-src 'self' data: blob: *.r2.dev *.cloudflarestorage.com localhost:5173; media-src 'self' blob: *.r2.dev *.cloudflarestorage.com; connect-src 'self' *.r2.dev *.cloudflarestorage.com ws://localhost:5173 localhost:5173; frame-ancestors 'none';" always;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always; # Aktifkan setelah HTTPS

    # Static assets — serve directly, long cache
    location ~* \.(css|js|woff2?|ttf|otf|eot|svg|ico|png|jpg|jpeg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Laravel entry point
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM
    location ~ \.php$ {
        set $upstream app:9000;
        fastcgi_pass $upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
    }

    # Block hidden files (except Let's Encrypt challenge)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Block access to sensitive Laravel dirs
    location ~* ^/(storage|bootstrap/cache) {
        deny all;
    }
}
