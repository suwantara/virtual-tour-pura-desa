# ─── Podman Compose — Development Environment ────────────────────────────────
# Usage:
#   podman compose -f docker-compose.dev.yml up -d
#   podman compose -f docker-compose.dev.yml down -v
#
# App:  http://localhost:8080
# Vite: http://localhost:5173 (HMR dev server)

services:

  # ── PHP-FPM (app) ─────────────────────────────────────────────────────────
  app:
    build:
      context: .
      target: base
    image: virtual-tour-dev
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: virtual_tour
      DB_USERNAME: laravel
      DB_PASSWORD: secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      VITE_DEV_SERVER_URL: http://localhost:5173
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
      - node_modules_data:/var/www/html/node_modules
      - storage_data:/var/www/html/storage
      - ./docker/php/zz-dev.conf:/usr/local/etc/php-fpm.d/zz-dev.conf:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network
    entrypoint: ["/var/www/html/docker/dev-entrypoint.sh"]
    command: ["php-fpm"]

  # ── Nginx ─────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/dev-default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/docker-entrypoint.sh:/docker-entrypoint.sh:ro
      - .:/var/www/html:ro
      - vendor_data:/var/www/html/vendor:ro
      - node_modules_data:/var/www/html/node_modules:ro
      - storage_data:/var/www/html/storage:ro
    entrypoint: ["/docker-entrypoint.sh"]
    depends_on:
      - app
    networks:
      - app_network

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: virtual_tour
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laravel -d virtual_tour"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Vite Dev Server (HMR) ─────────────────────────────────────────────────
  vite:
    build:
      context: .
      target: base
    restart: unless-stopped
    working_dir: /var/www/html
    command: >
      sh -c "
        if [ ! -f node_modules/.package-lock.json ]; then
          echo '→ Installing npm dependencies...' && npm install;
        fi &&
        echo '→ Starting Vite dev server...' &&
        npx vite
      "
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
      - node_modules_data:/var/www/html/node_modules
    ports:
      - "5173:5173"
    networks:
      - app_network
    depends_on:
      - app

networks:
  app_network:

volumes:
  postgres_data:
  redis_data:
  vendor_data:
  node_modules_data:
  storage_data:
